version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_HOST=redis
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - vector_data:/app/src/knowledge/vectors
      - learning_data:/app/src/knowledge/learning
    depends_on:
      - redis
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  vector_data:
  learning_data:
  redis_data:
