# Standalone Agents Configuration
# Copy this file to config.yaml and update with your settings

# LLM Provider Configuration
llm:
  default_provider: "openai"  # Options: openai, anthropic
  openai:
    api_key: "your-openai-api-key-here"
    model: "gpt-4-turbo-preview"
    temperature: 0.7
    max_tokens: 4096
  anthropic:
    api_key: "your-anthropic-api-key-here"
    model: "claude-3-opus-20240229"
    temperature: 0.7
    max_tokens: 4096

# Vector Database Configuration
vector_db:
  type: "chromadb"  # Options: chromadb, faiss
  persist_directory: "./src/knowledge/vectors"
  embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"

# Learning System Configuration
learning:
  enabled: true
  max_memory_size: 10000
  feedback_threshold: 3.5
  persistence_path: "./src/knowledge/learning"
  auto_save_interval: 100

# RAG System Configuration
rag:
  enabled: true
  chunk_size: 512
  chunk_overlap: 50
  top_k_results: 5
  min_relevance_score: 0.0

# Orchestrator Configuration
orchestrator:
  max_workers: 5
  enable_parallel: true
  default_strategy: "consensus"  # Options: parallel, sequential, hierarchical, consensus

# Agent-Specific Configuration
agents:
  medical:
    enabled: true
    temperature: 0.5  # Lower for more conservative medical advice
  legal:
    enabled: true
    temperature: 0.4
  finance:
    enabled: true
    temperature: 0.6
  education:
    enabled: true
    temperature: 0.7
  ecommerce:
    enabled: true
    temperature: 0.8
  customer_service:
    enabled: true
    temperature: 0.7

# Logging Configuration
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agents.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors_enabled: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

# Redis Configuration (for caching and state management)
redis:
  enabled: false
  host: "localhost"
  port: 6379
  db: 0
  password: null

# Monitoring
monitoring:
  enabled: true
  prometheus_port: 9090
  sentry_dsn: null  # Add your Sentry DSN for error tracking

# Multi-language Support
languages:
  supported:
    - "en"
    - "ar"
  default: "en"
  auto_detect: true

# Performance
performance:
  cache_responses: true
  cache_ttl: 3600  # 1 hour
  max_concurrent_requests: 100
  request_timeout: 30

# Security
security:
  enable_api_key: false
  api_keys: []
  rate_limiting:
    enabled: true
    requests_per_minute: 60
  data_encryption: false
