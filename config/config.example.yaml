# Egyptian Legal-Literacy Agent Configuration
# Copy this file to config.yaml and update with your settings.
#
# NOTE: only settings that are actually read by the code belong here.
# The previous version of this file (multi-domain era) listed sections like
# "rate_limiting: enabled: true" and "data_encryption" that were never wired
# to any implementation. Keep this file honest: if you add a setting, wire it
# up in the same change, or mark it clearly as "planned, not yet enforced".

# LLM Provider Configuration
llm:
  default_provider: "openai"  # Options: openai, anthropic
  openai:
    api_key: "your-openai-api-key-here"
    model: "gpt-4-turbo-preview"
    temperature: 0.2  # low temperature: this drafts legal text, not creative writing
    max_tokens: 2048
  anthropic:
    api_key: "your-anthropic-api-key-here"
    model: "claude-3-opus-20240229"
    temperature: 0.2
    max_tokens: 2048

# RAG index configuration (src/rag/legal_index.py)
rag:
  persist_directory: "./src/knowledge/vectors/legal_eg"
  embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  reranker_model: "BAAI/bge-reranker-v2-m3"  # multilingual, supports Arabic
  chunk_size: 512
  chunk_overlap: 50
  top_k_retrieve: 8
  top_k_after_rerank: 4

# Citation verification (src/verification/citation_verifier.py)
verification:
  max_draft_retries: 2       # how many times draft_answer retries after failed verification
  min_faithfulness_score: 0.85  # RAGAS threshold used in the eval harness (tests/eval)

# Feedback curation (src/feedback/curation_pipeline.py)
# Corrections are queued for human (lawyer) review; nothing is auto-learned.
feedback:
  db_path: "./src/knowledge/feedback/review_queue.db"

# Observability (Langfuse)
langfuse:
  enabled: false  # set true and provide keys via environment variables to enable tracing
  public_key: "${LANGFUSE_PUBLIC_KEY}"
  secret_key: "${LANGFUSE_SECRET_KEY}"
  host: "https://cloud.langfuse.com"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agent.log"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"

# Multi-language Support
languages:
  supported:
    - "ar"
    - "en"
  default: "ar"
  auto_detect: true

# Scope guardrails
# NOTE (honesty check on this exact file's own rule above): these lists are
# NOT actually read from this YAML at runtime yet — they mirror the hardcoded
# IN_SCOPE_TOPICS/OUT_OF_SCOPE_TOPICS constants in src/graph/legal_graph.py,
# which case_drafting_graph.py also imports and reuses. If you change scope,
# change it there; treat this block as documentation of that decision, not
# as live configuration, until someone wires it up.
scope:
  in_scope_topics:
    - "employment_contracts"
    - "labor_rights"
    - "rental_and_lease_contracts"
    - "consumer_contracts"
    - "basic_civil_contract_terms"
  explicitly_out_of_scope:
    - "criminal_law"
    - "litigation_strategy"
    - "court_filings"
    - "tax_law"

# Case-assistant track (src/agents/case_assistant/, src/subagents/)
# Higher risk than the literacy agent above — see PROJECT_OVERVIEW.md §6
# and docs/eval/case_drafting_audit.md before enabling for real users.
case_assistant:
  max_research_iterations: 3   # ResearchSubAgent's ReAct loop bound
  max_draft_retries: 2         # DraftingSubAgent's citation-verification retry bound
  web_search:
    provider: "tavily"         # requires TAVILY_API_KEY; falls back to local-only if unset
    trust_tier: "web_unverified"  # never elevated automatically — see docs/eval/case_drafting_audit.md
